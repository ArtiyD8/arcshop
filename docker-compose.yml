services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Передаем адрес работающего бэкенда
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: arcshop_frontend
    restart: always
    ports:
      - '5173:80'
    environment:
      - NODE_ENV=production